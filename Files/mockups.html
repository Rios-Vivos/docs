plo</span><span>◫ Sin iniciar</span></div></div></div>${footer}`,
 detail:()=>`${title('Investigaciones / En revisión','Hidrocarburos en Jalisco','Solicitudes, gacetas y expedientes ambientales · Periodo 2025–2026',`<button class="btn" onclick="go('chat')">◩ Consultar documentos</button>`)}${navtabs(tab)}${tab==='documents'?`${views.library()}`:`<div class="grid g4">${metric('538','Registros originales en CSV','▤')}${metric('38','Registros con enlace ERA','◫')}${metric('6','Municipios definidos','⌖')}${metric('Pendiente','Cobertura del corpus','◉')}</div><div class="steps"><span class="step done">✓ Archivos descargados</span><span class="step current">◉ Indexación en plataforma</span><span class="step">Revisión de evidencia</span><span class="step">Informe final</span></div><div class="twocol"><div class="grid"><div class="panel"><div class="row between"><h3 class="heading">Objetivo y alcance</h3><button class="mini-action" onclick="notify('Edición de alcance: demostración')">Editar alcance</button></div><p class="val">Determinar si existen proyectos de hidrocarburos ingresados, evaluados o autorizados en la región, conservando el respaldo documental de cada afirmación.</p><div class="line"></div><div class="labelrow"><span>Periodo: ${investigation.period}</span><span>Fuente: PNT / ASEA / Gacetas</span></div><p class="small muted">Municipios: Poncitlán, Zapotlán del Rey, Ocotlán, Juanacatlán, Ixtlahuacán de los Membrillos y Chapala.</p></div><div class="panel"><div class="row between"><h3 class="heading">Acciones siguientes</h3>${badge('3 tareas sugeridas')}</div><div class="row between" style="margin:12px 0"><span>Vincular archivos descargados</span><button class="btn tiny" onclick="go('library')">Biblioteca →</button></div><div class="row between" style="margin:12px 0"><span>Buscar documentos por municipio</span><button class="btn tiny" onclick="go('chat')">Buscar →</button></div><div class="row between" style="margin:12px 0"><span>Validar proyectos candidatos</span><button class="btn tiny" onclick="go('findings')">Hallazgos →</button></div></div></div><div class="grid"><div class="panel"><h3 class="heading">Participantes</h3><div class="row"><span class="avatar">C</span><div><b class="small">Equipo científico</b><div class="small muted">Revisión y validación</div></div></div><div class="line"></div><button class="btn tiny" onclick="notify('Invitaciones: demostración')">＋ Agregar colaborador</button></div><div class="panel"><h3 class="heading">Política de privacidad</h3>${badge('Solo fuentes autorizadas','ok')}<p class="small muted">Ningún proveedor externo recibe documentos sin autorización. El nodo local es opcional.</p></div></div></div>`}${footer}`,
 library:()=>`${title('Biblioteca documental','Archivos y carpetas','Conserva originales en S3, revisa la indexación y vincula fuentes a investigaciones.',`<button class="btn" onclick="openModal('folder')">＋ Nueva carpeta</button>`)}<div class="hero-upload"><div class="row"><span style="font-size:30px;color:#45aaff">⇪</span><div><b>Subir documentos o arrastrarlos aquí</b><div class="small muted">CSV · XLSX · PDF · OCR automático según necesidad</div></div></div><button class="btn primary" onclick="openModal('upload')">＋ Añadir archivos</button></div><div class="searchrow"><input class="input grow" placeholder="⌕  Buscar archivo, expediente o carpeta…" oninput="filterRows('files',this.value)"><select class="select"><option>Todos los tipos</option><option>PDF</option><option>CSV</option><option>XLSX</option></select><select class="select"><option>Todos los estados</option><option>Indexado</option><option>Procesando</option><option>Pendiente</option></select><button class="btn" onclick="openModal('associate')">＋ Asociar a investigación</button></div><h3 class="heading">Carpetas</h3><div class="folder cardlink" onclick="notify('Carpeta /PNT/ASEA_2026 — ejemplo')"><span class="glyph">▣</span><div><strong>PNT / ASEA 2026</strong><div class="small muted">Documentación original</div></div></div><div class="space"></div><div class="panel" style="padding:0;overflow:hidden"><table class="table"><thead><tr><th><input type="checkbox" aria-label="Seleccionar todos"></th><th>Documento</th><th>Tipo</th><th>Investigación</th><th>Procesamiento</th><th>Tamaño</th><th>Acción</th></tr></thead><tbody id="files"><tr><td><input type="checkbox"></td><td><span class="fileicon csv">CSV</span>detalle_formato_572_parte1.csv</td><td>CSV</td><td>Hidrocarburos en Jalisco</td><td>${badge('Indexado','ok')}</td><td>2.4 MB</td><td><button class="mini-action" onclick="go('chat')">Consultar ↗</button></td></tr><tr><td><input type="checkbox"></td><td><span class="fileicon csv">CSV</span>detalle_formato_5  chat:()=>`${title('Asistente / Hidrocarburos en Jalisco','Consulta de documentos','Preguntas sobre documentos asociados a esta investigación. Citas y revisión antes de confirmar.')}<div class="chatapp"><div class="chatleft"><div class="row between"><b>Conversaciones</b><button class="btn tiny" onclick="chatCount=0;go('chat')">＋</button></div><div class="line"></div><div class="session active">◩ Proyectos y actividades<span class="small muted" style="display:block;margin-left:20px">Sesión actual</span></div><div class="session" onclick="notify('Conversación de ejemplo')">◩ Empresas vinculadas</div><div class="session" onclick="notify('Conversación de ejemplo')">◩ Revisiones pendientes</div><div class="line"></div><button class="btn tiny" onclick="go('detail')">← Volver a investigación</button><p class="small muted" style="margin-top:25px">Modo de respuesta<br><b style="color:#dcecf8">Búsqueda primero · IA si hace falta</b></p></div><div class="chatcenter"><div class="row between" style="padding:16px 20px;border-bottom:1px solid #304455"><div><b>Consulta: Hidrocarburos en Jalisco</b><div class="small muted">Alcance documental · Fuentes disponibles</div></div>${badge('Costos controlados','ok')}</div><div class="messagearea" id="msgarea"><div class="bubble user">¿Qué autorizaciones de hidrocarburos aparecen en Ocotlán?</div><div class="bubble ai"><b>La autorización todavía no está confirmada.</b><p>El inventario de ejemplo permite localizar documentos candidatos, pero no basta para afirmar que un proyecto fue aprobado. Para confirmar cada caso se necesita identificar el resolutivo, oficio y fecha.</p><div class="sourcebox"><b>Fuentes consultables</b><div class="small muted">2 CSV del inventario (277 y 261 registros), periodo enero–junio 2026. No se ha confirmado cobertura documental suficiente para 2025.</div></div><div style="margin-top:12px"><button class="cit" onclick="openModal('evidence')">▤ CSV · Parte 1 · filas</button><button class="cit" onclick="openModal('evidence')">▤ CSV · Parte 2 · filas</button></div><div style="margin-top:10px"><button class="btn tiny" onclick="go('findings')">Guardar como hallazgo →</button></div></div></div><div class="chatcompose"><input id="ask" class="input" placeholder="Pregunta sobre expedientes, municipios, empresas…" onkeydown="if(event.key==='Enter')sendMessage()"><button class="btn primary" onclick="sendMessage()">Enviar ↗</button></div></div><div class="chatright"><div class="row between"><h3 class="heading">Evidencia</h3>${badge('Revisable')}</div><p class="small muted">Las citas muestran el documento original, no solo el texto generado.</p><div class="citesample"><div class="row"><span class="fileicon csv">CSV</span><b>Inventario PNT · 2026</b></div><p class="small muted">Parte 1 / Parte 2 · 538 registros nacionales según la fuente entregada.</p><button class="btn tiny" onclick="openModal('evidence')">Abrir documento ↗</button></div><div class="space"></div><div class="warnbox">No debe interpretarse una MIA o ERA como autorización aprobada sin un resolutivo verificable.</div><div class="space"></div><h3 class="heading">Costo de consulta</h3><div class="row between small"><span>Búsqueda estructurada</span><strong class="cost">0 tokens IA</strong></div><div class="line"></div><span class="small muted">Si necesita interpretación, el sistema muestra el proveedor y aplica cuotas.</span></div></div>${footer}`,
 findings:()=>`${title('Investigación / Hidrocarburos en Jalisco','Hallazgos y evidencias','Hipótesis documentales que requieren validación del equipo científico.',`<button class="btn primary" onclick="openModal('finding')">＋ Nuevo hallazgo</button>`)}<div class="callout">Los elementos siguientes son <b>ejemplos de diseño</b>, no resultados ni proyectos verificados. En producción cada afirmación requiere un fragmento documental auténtico.</div><div class="searchrow"><input class="input grow" placeholder="⌕  Buscar hallazgos…" oninput="filterRows('findingslist',this.value)"><select class="select"><option>Todos los estados</option><option>Por verificar</option><option>Confirmados</option><option>Descartados</option></select><select class="select"><option>Todos los municipios</option><option>Ocotlán</option><option>Poncitlán</option></select><button class="btn" onclick="notify('Exportación de ejemplo; no genera reporte real')">⇩ Exportar</button></div><div class="twocol"><div id="findingslist"><div class="cardhit"><div class="row between">${badge('Por verificar','warn')}<span class="small muted">Ejemplo 01</span></div><h4>Posible instalación de almacenamiento</h4><p class="hit-meta">Municipio: Ocotlán (no confirmado) · Estado de autorización: desconocido</p><div class="labelrow"><span>▤ Fuente aún pendiente</span><span>◷ Revisión requerida</span></div><div class="line"></div><button class="btn tiny" onclick="openModal('review')">Revisar hallazgo</button> <button class="btn tiny" onclick="openModal('evidence')">Ver evidencia</button></div><div class="cardhit"><div class="row between">${badge('Evidencia insuficiente','bad')}<span class="small muted">Ejemplo 02</span></div><h4>Actividad de transporte de hidrocarburos</h4><p class="hit-meta">Municipio no identificado · Sin expediente confirmado</p><div class="labelrow"><span>▤ Referencia documental</span><span>◷ Pendiente</span></div><div class="line"></div><button class="btn tiny" onclick="openModal('review')">Revisar hallazgo</button></div></div><div class="grid"><div class="panel"><h3 class="heading">Ciclo de validación</h3><div class="steps" style="flex-direction:column"><span class="step done">1. Candidato encontrado</span><span class="step current">2. Revisión de evidencias</span><span class="step">3. Validación científica</span><span class="step">4. Publicación de conclusión</span></div><p class="small muted">Cada cambio de estado guarda autor, fecha, comentario y evidencia de soporte.</p></div><div class="panel"><h3 class="heading">Criterios de confirmación</h3><p class="small muted">Una autorización requiere texto explícito en un resolutivo, número y fecha de oficio. La ausencia de un registro no acredita la inexistencia.</p></div></div></div>${footer}`,

tn tiny" onclick="openModal('provider')">Configurar →</button></div></div><div class="configcard"><div class="row between"><div class="row"><span style="font-size:25px">▣</span><div><b>Ollama / Nodo local</b><div class="small muted">GPU RTX 4070 SUPER · Tareas de lote (optativo)</div></div></div>${badge('Nodo fuera de línea','warn')}</div><div class="line"></div><div class="row between"><span class="small muted">Solo a través de conexión privada autenticada.</span><button class="btn tiny" onclick="go('workers')">Administrar nodo →</button></div></div></div><div class="grid"><div class="panel"><h3 class="heading">Reglas de selección</h3><div class="sourcebox"><b>1. Búsqueda exacta</b><div class="small muted">PostgreSQL, sin IA y sin costo de tokens.</div></div><div class="space"></div><div class="sourcebox"><b>2. Interpretación sencilla</b><div class="small muted">Modelo externo de bajo costo, si lo permite la investigación.</div></div><div class="space"></div><div class="sourcebox"><b>3. Lotes extensos</b><div class="small muted">Nodo local cuando esté disponible y autorizado.</div></div><div class="space"></div><div class="warnbox">Investigaciones con privacidad LOCAL_ONLY jamás hacen fallback externo.</div></div><div class="panel"><h3 class="heading">Separación de costos</h3><p class="small muted">Las cuentas de ChatGPT/Codex no reemplazan credenciales API. Las llamadas del backend se contabilizan aparte.</p></div></div></div>${footer}`,

:0;width:115px" value="Configurar"></div></div><div class="grid"><div class="panel"><h3 class="heading">Rutas por complejidad</h3><div class="row between" style="margin:10px 0"><span>Búsqueda SQL / filtros</span>${badge('Sin LLM','ok')}</div><div class="row between" style="margin:10px 0"><span>Respuesta explicativa</span>${badge('Modelo económico')}</div><div class="row between" style="margin:10px 0"><span>Lote grande</span>${badge('Nodo local preferido')}</div><div class="line"></div><p class="small muted">La política autoriza o rechaza el gasto antes de la ejecución. Las cotizaciones de lote necesitan confirmación.</p></div><div class="panel"><h3 class="heading">Reglas de seguridad</h3><p class="small muted">✓ No exponer API keys.<br>✓ Rate limiting desde backend.<br>✓ Reservas atómicas de presupuesto.<br>✓ Registro y conciliación de uso.<br>✓ Fallback solo si privacidad lo permite.</p></div></div></div>${footer}`,

lisco</td><td>${badge('No iniciado','warn')}</td><td>Local preferido</td></tr><tr><td>demo-index-002</td><td>Indexación FTS</td><td>Hidrocarburos en Jalisco</td><td>${badge('Ejemplo')}</td><td>Servidor</td></tr></tbody></table></div>${footer}`

function go(name){page=name;location.hash=name;document.getElementById('breadcrumb').textContent=pages[name]||name;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===name || (name==='detail'&&x.dataset.page==='investigations')));document.getElementById('screen').innerHTML=views[name]();window.scrollTo(0,0)}
function filterCards(q){document.querySelectorAll('#investCards>[data-name]').forEach(x=>x.style.display=x.dataset.name.toLowerCase().includes(q.toLowerCase())?'':'none')}
function filterRows(id,q){document.querySelectorAll('#'+id+' tr').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q.toLowerCase())?'':'none')}
function notify(s){alert(s+'\n\nEste archivo es un mockup navegable. No realiza cambios en servidores.')}
function closeModal(){document.getElementById('modalshade').classList.remove('show')}
function openModal(kind){let body={new:`<h3>Nueva investigación</h3><label class="field-label">Nombre</label><input class="input" value="Investigación ambiental 2026"><label class="field-label">Objetivo</label><textarea class="input">Identificar proyectos ambientales y documentos que los sustentan.</textarea><div class="grid g2"><div><label class="field-label">Inicio</label><input class="input" type="date" value="2025-01-01"></div><div><label class="field-label">Fin</label><input class="input" type="date" value="2026-12-31"></div></div>`,folder:`<h3>Nueva carpeta</h3><label class="field-label">Nombre de carpeta</label><input class="input" value="Gacetas ASEA">`,upload:`<h3>Subir archivos</h3><p class="muted">Demo sin subida real: la implementación utilizará carga segura a S3 y procesamiento asíncrono.</p><input class="input" type="file" multiple><label class="field-label">Asociar con investigación</label><select class="select"><option>Hidrocarburos en Jalisco</option><option>Sin asociar</option></select>`,associate:`<h3>Asociar documentos</h3><p class="muted">Los archivos existentes se vinculan a la investigación sin duplicarlos en S3.</p><label class="field-label">Investigación</label><select class="select"><option>Hidrocarburos en Jalisco</option><option>Calidad del agua — Río Santiago</option></select>`,evidence:`<h3>Visor de evidencia</h3><div class="sourcebox"><b>Documento original · ejemplo</b><p class="small">En la implementación, este panel abrirá el PDF en la página exacta o el Excel en la hoja/fila indicada, recuperado con permiso server-side.</p></div><p class="muted">No se muestra texto documental inventado.</p>`,finding:`<h3>Nuevo hallazgo</h3><label class="field-label">Título</label><input class="input" placeholder="Descripción del proyecto candidato"><label class="field-label">Afirmación</label><textarea class="input" placeholder="¿Qué se identificó y qué falta verificar?"></textarea><div class="warnbox">El estado inicial será «Por verificar» hasta adjuntar evidencia y completar revisión.</div>`,review:`<h3>Revisar hallazgo</h3><label class="field-label">Resultado</label><select class="select"><option>Por verificar</option><option>Confirmado</option><option>Descartado</option><option>Evidencia insuficiente</option></select><label class="field-label">Comentario de revisión</label><textarea class="input" placeholder="Anotar sustento y referencias"></textarea>`,provider:`<h3>Configurar proveedor</h3><div class="warnbox">Las credenciales reales se guardan cifradas del lado servidor. Este mockup no transmite ni almacena claves.</div><label class="field-label">Proveedor</label><select class="select"><option>OpenAI</option><option>Anthropic</option><option>Ollama</option></select><label class="field-label">URL base</label><input class="input" value="https://api.ejemplo.invalid"><label class="field-label">API key</label><input class="input" type="password" placeholder="No introduzcas claves reales en el mockup">`,worker:`<h3>Registrar nodo local</h3><p class="muted">El nodo se autentica al conectarse desde tu PC usando un canal privado. La URL de Ollama no debe ser pública.</p><label class="field-label">Nombre del nodo</label><input class="input" value="RTX-4070-SUPER"><label class="field-label">Política</label><select class="select"><option>Trabajos por lotes; local preferido</option><option>Solo procesar local-only</option></select>`}[kind]||'<h3>Vista demo</h3>';document.getElementById('modalbody').innerHTML=body+`<div class="formfooter"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="closeModal();notify('Acción de demostración')">Continuar</button></div>`;document.getElementById('modalshade').classList.add('show')}
function sendMessage(){let inp=document.getElementById('ask');if(!inp||!inp.value.trim())return;const area=document.getElementById('msgarea');const question=inp.value.replace(/[<>]/g,'');const user=document.createElement('div');user.className='bubble user';user.textContent=question;area.appendChild(user);const reply=document.createElement('div');reply.className='bubble ai';reply.innerHTML='<b>Mockup: búsqueda contextual</b><p>Esta demostración no tiene acceso al corpus real. La implementación buscará primero en SQL/FTS y citará documentos auténticos. Si no hay evidencia suficiente, lo indicará explícitamente.</p><button class="cit" onclick="openModal(\'evidence\')">▤ Ejemplo de cita</button>';area.appendChild(reply);inp.value='';area.scrollTop=area.scrollHeight}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(views[h])go(h)});go(views[location.hash.slice(1)]?location.hash.slice(1):'investigations');
